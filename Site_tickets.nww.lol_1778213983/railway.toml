[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[env]
NODE_ENV = "production"
PORT = "8080"

[nixpacks]
build-image = "ubuntu:22.04"

[nixpacks.build]
cmd = "npm install"

[nixpacks.start]
cmd = "npm start"
